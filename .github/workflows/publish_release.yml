name: Main

on: push

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare archive
        run: |
         TAG="${{ github.ref_name }}"
         git archive \
           --format=zip \
           --output=release.zip \
           --prefix=gha-test-${TAG}/
           ${TAG}
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: release.zip