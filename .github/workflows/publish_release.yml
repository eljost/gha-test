name: Main

on: push

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
         TAG: github.ref_name
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare archive
        run: |
         git archive \
           --format=zip \
           --output=gha-test-${TAG}.zip \
           --prefix=gha-test-${TAG}/ \
           --worktree-attributes \
           -v \
           ${TAG}
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: gha-test-${TAG}.zip